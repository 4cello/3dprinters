[menu __main toolchanger green]
type: command
name: Green Tool
enable: True
index: 2
gcode: T2

[filament_switch_sensor green_sensor]
switch_pin: green:PB4
pause_on_runout: False
runout_gcode: runout_init
insert_gcode: filament_load_init
event_delay: 1.0
pause_delay: 0.1

