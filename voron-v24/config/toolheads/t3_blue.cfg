[mcu blue]
canbus_uuid: 6cd84884c4a5

[adxl345]
cs_pin: blue:PB12
spi_software_sclk_pin: blue:PB10
spi_software_mosi_pin: blue:PB11
spi_software_miso_pin: blue:PB2
axes_map: x,y,z

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

[extruder3]
step_pin: blue:PD0
dir_pin: blue:PD1
enable_pin: !blue:PD2
microsteps: 16
rotation_distance: 4.637
nozzle_diameter: 0.600
filament_diameter: 1.750
max_extrude_only_distance: 150
heater_pin: blue:PB13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: blue:PA3
control: pid
pid_Kp: 37.940
pid_Ki: 16.862
pid_Kd: 21.341
min_temp: 0
max_temp: 320

[tmc2209 extruder3]
uart_pin: blue:PA15
run_current: 0.350
stealthchop_threshold: 999999

[fan_generic blue_part_fan]
pin: blue:PA0
cycle_time: 0.010

[heater_fan blue_hotend_fan]
pin: blue:PA1
heater: extruder3
heater_temp: 50.0
cycle_time: 0.010

#[neopixel hotend_rgb]
#pin: blue:gpio16

[tool blue]
tool_number: 3
extruder: extruder3
#params_type: 'rods_mini_hookon'
fan: blue_part_fan
gcode_x_offset: -0.700000
gcode_y_offset: -0.087500
gcode_z_offset: -0.193750
# Position with the toolhead aligned with the dock
params_park_x: 257.5
params_park_y: 3.0
params_park_z: 334.0
params_safe_y: 120
params_close_y: 30

[gcode_macro T3]
rename_existing: T3000
variable_spool_id: None
variable_color: ""
gcode:
  SET_ACTIVE_SPOOL ID={spool_id}
  T3000


