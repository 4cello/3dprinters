[menu __main toolchanger blue]
type: command
name: Blue Tool
enable: True
index: 3
gcode: T3

[filament_switch_sensor blue_sensor]
switch_pin: blue:PB4
pause_on_runout: False
# runout_gcode: runout_init
# insert_gcode: filament_load_init
event_delay: 1.0
pause_delay: 0.1

